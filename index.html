<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VORTEX X1 — 102mm Iris Throttle Body | Hero Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Inter', 'Orbitron', system-ui, -apple-system, sans-serif;
            background-color: #03050b;
            color: white;

        /* HERO UI OVERLAY — cinematic, minimal, high-tech */
        .hero-title {
            position: absolute;
            top: 32px;
            left: 32px;
            z-index: 20;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .hero-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #ffffff, #ffaa44, #ff6633);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,102,51,0.3);
            letter-spacing: 2px;
        }

        .hero-title p {
            font-size: 0.85rem;
            margin: 5px 0 0;
            opacity: 0.8;
            letter-spacing: 1.5px;
            font-weight: 300;
        }

        .spec-badge {
            position: absolute;
            top: 32px;
            right: 32px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 24px;
            border-right: 3px solid #ff4d2e;
            border-top: 1px solid rgba(255,255,255,0.25);
            z-index: 20;
            pointer-events: none;
            text-align: right;
            font-family: monospace;
        }

        .spec-badge .bore {
            font-size: 1.8rem;

            color: #ffaa44;

        }

        .spec-badge .label {
            font-size: 0.7rem;

            text-transform: uppercase;
        }

        .iris-tech {
            position: absolute;
            bottom: 100px;
            left: 32px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 0.8rem;
            border-left: 3px solid #ff4d2e;
            z-index: 20;
            pointer-events: none;
            font-weight: 500;
        }

        /* CONTROL PANEL — sleek, modern */
        .control-panel {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: rgba(12, 12, 20, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            z-index: 30;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            font-family: 'Inter', monospace;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .hero-btn {
            background: rgba(20,20,32,0.9);
            border: none;
            color: #eee;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hero-btn:hover {
            background: #ff4d2e;
            color: white;
            box-shadow: 0 0 12px #ff4d2e;
            border-color: #ffaa77;
        }

        .throttle-box {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0,0,0,0.5);
            padding: 6px 20px;
            border-radius: 60px;
        }

        .throttle-box label {
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 260px;
            height: 4px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00aaff, #ffaa33, #ff3300);
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            border: 2px solid #ff4d2e;
            cursor: pointer;
            box-shadow: 0 0 6px #ff4d2e;
        }

        .throttle-percent {
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffaa44;
            min-width: 70px;
            text-align: center;
        }

        .status-led {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #0f0;
            border-radius: 50%;
            box-shadow: 0 0 6px #0f0;
            margin-right: 6px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

        .telegram-chat {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #0088cc;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 40;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            border: none;
        }

        .telegram-chat:hover { transform: scale(1.1); background: #2aabee; }

        .footer-note {
            position: absolute;
            bottom: 16px;
            left: 20px;
            font-size: 9px;
            opacity: 0.5;
            z-index: 20;
            font-family: monospace;
            pointer-events: none;
        }

        @media (max-width: 800px) {
            .control-panel { flex-direction: column; align-items: stretch; border-radius: 28px; }
            .btn-group { justify-content: center; }
            .throttle-box { justify-content: space-between; }
            .hero-title h1 { font-size: 1.3rem; }
            .spec-badge { top: 16px; right: 16px; padding: 6px 16px; }
        }
    </style>
</head>

<div class="hero-title">

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    
    // --- setup REALISTIC scene (Hero lighting + cinematic depth) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020410);
    scene.fog = new THREE.FogExp2(0x020410, 0.012);
    
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4.2, 2.4, 4.8);
    camera.lookAt(0, 0.1, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);
    
    // controls with hero smoothness
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 1.2;
    controls.zoomSpeed = 1.0;
    controls.panSpeed = 0.8;
    controls.enableZoom = true;
    controls.autoRotate = false;
    
    // --- LIGHTS: Studio / Hero quality (dramatic, metallic reflections) ---
    const ambient = new THREE.AmbientLight(0x181c2c);
    scene.add(ambient);
    const keyLight = new THREE.DirectionalLight(0xffeedd, 1.3);
    keyLight.position.set(2, 3.5, 1.8);
    keyLight.castShadow = true;
    keyLight.receiveShadow = false;
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x4466aa, 0.65);
    fillLight.position.set(-1.5, 1.2, 2.5);
    scene.add(fillLight);
    const rimLight = new THREE.PointLight(0xffaa66, 0.9);
    rimLight.position.set(1.2, 1.5, -2.4);
    scene.add(rimLight);
    const backRim = new THREE.PointLight(0xff8844, 0.6);
    backRim.position.set(-1.0, 1.0, -2.8);
    scene.add(backRim);
    const underGlow = new THREE.PointLight(0x335588, 0.4);
    underGlow.position.set(0, -0.8, 0);
    scene.add(underGlow);
    
    // subtle reflective ground plane (only for reflections)
    const gridHelper = new THREE.GridHelper(7, 24, 0x557799, 0x224455);
    gridHelper.position.y = -1.25;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.22;
    scene.add(gridHelper);
    
    // ---- Main Throttle Body Housing (CNC Machined Aluminum) ----
    const tbGroup = new THREE.Group();
    
    // main cylinder bore exterior with realistic flanges
    const bodyGeo = new THREE.CylinderGeometry(1.08, 1.08, 0.88, 64, 64);
    const alumMat = new THREE.MeshStandardMaterial({ color: 0xbcc8dc, roughness: 0.28, metalness: 0.94, emissive: 0x000000 });
    const mainBody = new THREE.Mesh(bodyGeo, alumMat);
    mainBody.castShadow = true;
    tbGroup.add(mainBody);
    
    // intake flange (4 bolt pattern hinted)
    const flangeRingGeo = new THREE.TorusGeometry(1.12, 0.045, 48, 120);
    const flangeMat = new THREE.MeshStandardMaterial({ color: 0xccbb99, metalness: 0.82, roughness: 0.35 });
    const topFlange = new THREE.Mesh(flangeRingGeo, flangeMat);
    topFlange.position.y = 0.46;
    topFlange.rotation.x = Math.PI / 2;
    tbGroup.add(topFlange);
    
    const bottomFlange = new THREE.Mesh(flangeRingGeo, flangeMat);
    bottomFlange.position.y = -0.46;
    bottomFlange.rotation.x = Math.PI / 2;
    tbGroup.add(bottomFlange);
    
    // actuator housing (drive by wire)
    const actuatorBox = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.95), new THREE.MeshStandardMaterial({ color: 0x8f9eb0, metalness: 0.75, roughness: 0.4 }));
    actuatorBox.position.set(1.22, 0.18, 0.48);
    actuatorBox.castShadow = true;
    tbGroup.add(actuatorBox);
    
    // embossed text simulation: "VORTEX X1 | 102mm" on actuator side using simple decal-like geometry
    const textPlate = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.18, 0.05), new THREE.MeshStandardMaterial({ color: 0xccaa77, metalness: 0.6, roughness: 0.3 }));
    textPlate.position.set(1.27, 0.18, 0.96);
    tbGroup.add(textPlate);
    
    // smaller badge detail (engraved look)
    const badgeGeo = new THREE.BoxGeometry(0.45, 0.09, 0.03);
    const badgeMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, metalness: 0.85, emissive: 0x331100 });
    const badge = new THREE.Mesh(badgeGeo, badgeMat);
    badge.position.set(1.27, 0.18, 1.01);
    tbGroup.add(badge);
    
    // Add bolt heads (decorative)
    const boltMat = new THREE.MeshStandardMaterial({ color: 0xddbb99, metalness: 0.7 });
    for (let i = 0; i < 4; i++) {
        const angle = (i * Math.PI * 2) / 4;
        const rx = Math.cos(angle) * 1.12;
        const rz = Math.sin(angle) * 1.12;
        const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.08, 12), boltMat);
        bolt.position.set(rx, 0.42, rz);
        tbGroup.add(bolt);
        const boltBottom = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.08, 12), boltMat);
        boltBottom.position.set(rx, -0.44, rz);
        tbGroup.add(boltBottom);
    }
    
    scene.add(tbGroup);
    
    // ---- LS-style intake manifold base ----
    const intakeBase = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.42, 1.75), new THREE.MeshStandardMaterial({ color: 0x7e8e9e, metalness: 0.65, roughness: 0.6 }));
    intakeBase.position.set(0, -0.72, 0);
    intakeBase.castShadow = true;
    scene.add(intakeBase);
    
    const plenum = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.05, 0.48, 12), new THREE.MeshStandardMaterial({ color: 0x6a7a8a, metalness: 0.6, roughness: 0.5 }));
    plenum.position.set(0, -0.48, 0.12);
    scene.add(plenum);
    
    // ---- 9-BLADE IRIS MECHANISM (TRUE KINEMATICS: RETRACT INTO WALL AT WOT) ----
    const BLADES = 9;
    const BORE_RADIUS = 1.02;      // 102mm diameter visualized
    const IDLE_HOLE_RADIUS = 0.022; // 2.2mm near perfect circle
    const PIVOT_RADIUS = 1.11;      // pivot near inner wall
    const BLADE_LEN = 1.28;
    const BLADE_WID = 0.14;
    
    const bladeGroup = new THREE.Group();
    const bladesArray = [];
    const titaniumMat = new THREE.MeshStandardMaterial({ color: 0xcab577, metalness: 0.92, roughness: 0.22, emissive: 0x221100 });
    
    for (let i = 0; i < BLADES; i++) {
        const bladeGeo = new THREE.BoxGeometry(BLADE_WID, BLADE_LEN, 0.022);
        const blade = new THREE.Mesh(bladeGeo, titaniumMat.clone());
        const angle = (i * Math.PI * 2) / BLADES;
        const pivotX = Math.cos(angle) * PIVOT_RADIUS;
        const pivotZ = Math.sin(angle) * PIVOT_RADIUS;
        const dirX = -Math.cos(angle);
        const dirZ = -Math.sin(angle);
        const initX = pivotX + dirX * (BLADE_LEN * 0.48);
        const initZ = pivotZ + dirZ * (BLADE_LEN * 0.48);
        blade.position.set(initX, 0.012, initZ);
        blade.rotation.y = angle + Math.PI / 2;
        blade.userData = {
            pivotX, pivotZ, dirX, dirZ, angle,
            initX, initZ
        };
        blade.castShadow = true;
        bladeGroup.add(blade);
        bladesArray.push(blade);
    }
    scene.add(bladeGroup);
    
    // add inner decorative ring
    const innerRing = new THREE.Mesh(new THREE.TorusGeometry(BORE_RADIUS - 0.035, 0.025, 64, 150), new THREE.MeshStandardMaterial({ color: 0xccaa88, metalness: 0.78 }));
    innerRing.rotation.x = Math.PI / 2;
    innerRing.position.y = 0.022;
    scene.add(innerRing);
    
    // ----- VAPOR PARTICLES (high throttle effect) -----
    const particleCount = 680;
    const particleGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        posArray[i*3] = (Math.random() - 0.5) * 3.0;
        posArray[i*3+1] = (Math.random() - 0.5) * 1.6;
        posArray[i*3+2] = (Math.random() - 0.5) * 2.8;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x88bbff, size: 0.022, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);
    
    // ---- AUDIO: Deep V8 Muscle (realistic, no chiptune) ----
    let audioCtx = null;
    let isMuted = false;
    let masterGain = null;
    let oscLow, oscMid, subOsc, lpf;
    let audioActive = false;
    
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.3;
        masterGain.connect(audioCtx.destination);
        lpf = audioCtx.createBiquadFilter();
        lpf.type = "lowpass";
        lpf.frequency.value = 380;
        lpf.Q.value = 2.8;
        
        oscLow = audioCtx.createOscillator();
        oscMid = audioCtx.createOscillator();
        subOsc = audioCtx.createOscillator();
        oscLow.type = "sawtooth";
        oscMid.type = "triangle";
        subOsc.type = "sine";
        
        const gainLow = audioCtx.createGain();
        const gainMid = audioCtx.createGain();
        const gainSub = audioCtx.createGain();
        gainLow.gain.value = 0.5;
        gainMid.gain.value = 0.32;
        gainSub.gain.value = 0.42;
        
        oscLow.connect(gainLow);
        oscMid.connect(gainMid);
        subOsc.connect(gainSub);
        gainLow.connect(lpf);
        gainMid.connect(lpf);
        gainSub.connect(lpf);
        lpf.connect(masterGain);
        
        oscLow.start();
        oscMid.start();
        subOsc.start();
        audioActive = true;
    }
    
    function updateEngineAudio(throttle) {
        if (!audioCtx || isMuted || !audioActive) return;
        const rpm = 720 + (throttle / 100) * 6200;
        const freqBase = (rpm / 60) * 3.95; // V8 primary
        const targetHz = Math.min(210, Math.max(32, freqBase));
        oscLow.frequency.value = targetHz;
        oscMid.frequency.value = targetHz * 1.008;
        subOsc.frequency.value = targetHz * 0.5;
        const filterFreq = 320 + (throttle / 100) * 2900;
        lpf.frequency.value = Math.min(3300, filterFreq);
        masterGain.gain.value = 0.22 + (throttle / 100) * 0.45;
    }
    
    function resumeAudio() {
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        else if (!audioCtx) initAudio();
    }
    document.body.addEventListener("click", resumeAudio, { once: true });
    
    // ---- IRIS CONTROL: 0% -> 2mm hole, 100% -> blades disappear into wall (fully retracted) ----
    let currentThrottle = 0;
    
    function setThrottle(value) {
        currentThrottle = Math.min(100, Math.max(0, value));
        const t = currentThrottle / 100;
        document.getElementById("throttleSlider").value = currentThrottle;
        document.getElementById("throttleValue").innerText = Math.floor(currentThrottle) + "%";
        
        // blade update: retract + rotate out
        bladesArray.forEach(blade => {
            const d = blade.userData;
            // retract factor: 0 = idle position, 1 = fully hidden inside wall (pushed outwards)
            let retract = t * 1.2;
            if (retract > 1.0) retract = 1.0;
            // Interpolate position: from initial inward tip -> outward beyond bore edge
            const outwardX = d.pivotX + d.dirX * (retract * 0.98);
            const outwardZ = d.pivotZ + d.dirZ * (retract * 0.98);
            blade.position.x = d.initX * (1 - retract) + outwardX * retract;
            blade.position.z = d.initZ * (1 - retract) + outwardZ * retract;
            // rotate blade to tuck into housing wall at WOT
            const extraRot = retract * Math.PI * 0.62;
            blade.rotation.y = d.angle + Math.PI / 2 + extraRot;
            if (retract > 0.85) {
                blade.material.opacity = 1 - (retract - 0.85) / 0.15;
                blade.material.transparent = true;
            } else {
                blade.material.opacity = 1;
                blade.material.transparent = false;
            }
        });
        
        // Vapor at high throttle 90%+
        const vaporAlpha = Math.min(0.65, Math.max(0, (t - 0.88) / 0.12));
        particleMat.opacity = vaporAlpha * 0.7;
        if (vaporAlpha > 0.05) particles.rotation.y += 0.025;
        
        if (audioCtx && audioCtx.state === "running" && !isMuted) updateEngineAudio(currentThrottle);
    }
    
    // ---- UI BINDINGS ----
    const slider = document.getElementById("throttleSlider");
    const fullOpenBtn = document.getElementById("fullOpenBtn");
    const fullCloseBtn = document.getElementById("fullCloseBtn");
    const cycleBtn = document.getElementById("cycleBtn");
    const wireBtn = document.getElementById("wireBtn");
    const muteButton = document.getElementById("muteBtn");
    
    let cycleInterval = null;
    let cycling = false;
    
    slider.addEventListener("input", (e) => { if (cycling) stopCycle(); setThrottle(parseFloat(e.target.value)); });
    fullOpenBtn.addEventListener("click", () => { if (cycling) stopCycle(); setThrottle(100); });
    fullCloseBtn.addEventListener("click", () => { if (cycling) stopCycle(); setThrottle(0); });
    
    function stopCycle() { if (cycleInterval) clearInterval(cycleInterval); cycling = false; cycleBtn.textContent = "▶ CYCLE [SPACE]"; }
    function startCycle() {
        if (cycleInterval) clearInterval(cycleInterval);
        cycling = true;
        let direction = 1;
        let val = 0;
        setThrottle(0);
        cycleInterval = setInterval(() => {
            if (!cycling) return;
            val += direction * 1.9;
            if (val >= 100) { val = 100; direction = -1; }
            if (val <= 0) { val = 0; direction = 1; }
            setThrottle(val);
        }, 30);
        cycleBtn.textContent = "⏸ STOP [SPACE]";
    }
    cycleBtn.addEventListener("click", () => { if (cycling) stopCycle(); else startCycle(); });
    
    let wireframe = false;
    wireBtn.addEventListener("click", () => {
        wireframe = !wireframe;
        bladesArray.forEach(b => b.material.wireframe = wireframe);
        mainBody.material.wireframe = wireframe;
        actuatorBox.material.wireframe = wireframe;
        wireBtn.textContent = wireframe ? "🔲 SOLID [W]" : "🔲 WIREFRAME [W]";
    });
    
    let soundMuted = false;
    muteButton.addEventListener("click", () => {
        if (!audioCtx) initAudio();
        soundMuted = !soundMuted;
        if (masterGain) masterGain.gain.value = soundMuted ? 0 : 0.35;
        muteButton.textContent = soundMuted ? "🔇 SOUND OFF" : "🎧 SOUND ON";
        isMuted = soundMuted;
        if (!soundMuted && audioCtx && currentThrottle > 0) updateEngineAudio(currentThrottle);
    });
    
    // keyboard shortcuts
    window.addEventListener("keydown", (e) => {
        switch(e.key.toLowerCase()) {
            case 'o': setThrottle(100); break;
            case 'c': setThrottle(0); break;
            case ' ': e.preventDefault(); if (cycling) stopCycle(); else startCycle(); break;
            case 'w': wireBtn.click(); break;
            case 'm': muteButton.click(); break;
            case 'r': camera.position.set(4.2, 2.4, 4.8); controls.target.set(0,0.1,0); controls.update(); break;
        }
    });
    
    document.getElementById("telegramBtn").addEventListener("click", () => window.open("https://t.me/owensonicinfinity", "_blank"));
    
    setThrottle(0);
    
    // Hero camera intro small drift
    let time = 0;
    function animateCamera() {
        if (!controls.autoRotate) {
            time += 0.002;
            const slightYaw = Math.sin(time) * 0.08;
            if (currentThrottle < 5 && !cycling) {
                controls.target.set(slightYaw * 0.1, 0.1, 0);
                controls.update();
            }
        }
        requestAnimationFrame(animateCamera);
    }
    animateCamera();
    
    function renderLoop() {
        requestAnimationFrame(renderLoop);
        controls.update();
        renderer.render(scene, camera);
    }
    renderLoop();
    
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    console.log("VORTEX X1 | 102mm Hero Iris — Real blades retract fully at WOT.");
</script>
</body>
</html>
