<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vortex X1 Iris Throttle Body - 9-Blade Precision</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Roboto', 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        /* UI Overlay */
        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px 24px;
            color: white;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-weight: 500;
            pointer-events: auto;
        }
        
        .controls-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        button {
            background: rgba(30, 30, 40, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
        
        button:hover {
            background: #ff4d2e;
            border-color: #ff7a5c;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255, 77, 46, 0.4);
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.5);
            padding: 5px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        
        .slider-container label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        input[type="range"] {
            width: 260px;
            height: 4px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #0f0, #ffaa00, #ff3300);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            border: 2px solid #ff4d2e;
            box-shadow: 0 0 8px #ff4d2e;
            cursor: pointer;
        }
        
        .throttle-value {
            background: #000000aa;
            padding: 4px 12px;
            border-radius: 32px;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffaa44;
            min-width: 70px;
            text-align: center;
        }
        
        .status-led {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #4caf50;
            box-shadow: 0 0 6px #4caf50;
            margin-right: 8px;
            animation: pulse 1.2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9);}
            100% { opacity: 1; transform: scale(1.2);}
        }
        
        .badge {
            font-size: 12px;
            background: #00000066;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: monospace;
        }
        
        .telegram-bubble {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0088cc;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            z-index: 20;
            transition: transform 0.2s;
            border: none;
        }
        
        .telegram-bubble:hover {
            transform: scale(1.08);
            background: #2aabee;
        }
        
        .telegram-bubble svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
        
        .instruction-tip {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
            pointer-events: none;
            font-family: monospace;
            z-index: 10;
        }
        
        @media (max-width: 780px) {
            .ui-panel { flex-direction: column; align-items: stretch; bottom: 12px; left: 12px; right: 12px; padding: 12px; }
            .controls-group { justify-content: center; }
            .slider-container { width: 100%; justify-content: space-between; }
            input[type="range"] { flex: 1; }
        }
        
        a {
            color: white;
            text-decoration: none;
        }
        
        .footer-legal {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 9px;
            color: #aaa;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <div class="controls-group">
            <button id="fullOpenBtn">🔥 FULL OPEN (O)</button>
            <button id="fullCloseBtn">❄️ FULL CLOSE (C)</button>
            <button id="cycleBtn">▶ CYCLE (Space)</button>
            <button id="wireframeBtn">🔲 WIREFRAME (W)</button>
            <button id="muteBtn">🔊 ON (M)</button>
        </div>
        <div class="slider-container">
            <label>⚙️ THROTTLE</label>
            <input type="range" id="throttleSlider" min="0" max="100" step="0.5" value="0">
            <div class="throttle-value" id="throttlePercent">0%</div>
        </div>
        <div class="badge">
            <span class="status-led"></span> VORTEX X1 · 9-BLADE IRIS · 102mm BORE
        </div>
    </div>
    <div class="telegram-bubble" id="telegramBtn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.66-.35-1.02.22-1.61.15-.15 2.76-2.53 2.81-2.75.006-.03.01-.14-.06-.2-.07-.06-.18-.04-.26-.02-.1.02-1.74 1.1-4.91 3.25-.47.32-.89.48-1.27.47-.42-.01-1.22-.24-1.82-.43-.74-.25-1.33-.38-1.28-.81.03-.23.34-.46.94-.7 3.68-1.6 6.14-2.66 7.38-3.17 3.52-1.44 4.25-1.69 4.73-1.7.1 0 .34.02.5.16.13.11.17.27.19.46-.02.08-.02.16 0 .18z"/></svg>
    </div>
    <div class="instruction-tip">
        🖱️ Drag to rotate | Scroll zoom | Right-click pan
    </div>
    <div class="footer-legal">
        © 2026 Douglas Owens Jr. — OwenSonicInfinity | Vortex X1 Iris Throttle Body | Prototype Visualization
    </div>

    <!-- Three.js core -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        
        // --- setup scene, camera, renderers ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        // CSS2DRenderer for subtle text labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        
        // --- Lighting (realistic metal) ---
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x4466aa, 0.5);
        fillLight.position.set(-1, 2, 3);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(0, 1.5, -2);
        scene.add(backLight);
        const rimLight = new THREE.PointLight(0xff8844, 0.6);
        rimLight.position.set(1, 2, -2.5);
        scene.add(rimLight);
        
        // Optional: subtle grid helper floor
        const gridHelper = new THREE.GridHelper(8, 20, 0x335588, 0x224466);
        gridHelper.position.y = -1.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);
        
        // --- Throttle body housing (CNC aluminum) ---
        const housingGroup = new THREE.Group();
        
        // main cylindrical body
        const bodyGeo = new THREE.CylinderGeometry(1.05, 1.05, 0.85, 64, 64);
        const alumMaterial = new THREE.MeshStandardMaterial({ color: 0xc0d0e0, roughness: 0.32, metalness: 0.92, emissive: 0x000000, flatShading: false });
        const bodyMesh = new THREE.Mesh(bodyGeo, alumMaterial);
        bodyMesh.castShadow = true;
        bodyMesh.receiveShadow = false;
        housingGroup.add(bodyMesh);
        
        // flange rings
        const flangeGeo = new THREE.TorusGeometry(1.08, 0.05, 48, 100);
        const flangeMat = new THREE.MeshStandardMaterial({ color: 0xbbaa99, metalness: 0.85, roughness: 0.3 });
        const topFlange = new THREE.Mesh(flangeGeo, flangeMat);
        topFlange.position.y = 0.44;
        topFlange.rotation.x = Math.PI / 2;
        housingGroup.add(topFlange);
        
        const bottomFlange = new THREE.Mesh(flangeGeo, flangeMat);
        bottomFlange.position.y = -0.44;
        bottomFlange.rotation.x = Math.PI / 2;
        housingGroup.add(bottomFlange);
        
        // actuator housing (side drive-by-wire)
        const actuatorGeo = new THREE.BoxGeometry(0.7, 0.5, 0.9);
        const actuatorMat = new THREE.MeshStandardMaterial({ color: 0x8a9bb0, metalness: 0.78, roughness: 0.45 });
        const actuator = new THREE.Mesh(actuatorGeo, actuatorMat);
        actuator.position.set(1.2, 0.15, 0.45);
        actuator.castShadow = true;
        housingGroup.add(actuator);
        
        const actuatorCap = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), new THREE.MeshStandardMaterial({ color: 0xccaa77, metalness: 0.6, roughness: 0.4 }));
        actuatorCap.position.set(1.45, 0.15, 0.65);
        housingGroup.add(actuatorCap);
        
        scene.add(housingGroup);
        
        // --- Iris Blades Array (9 flat blades, true iris kinematics) ---
        const BLADE_COUNT = 9;
        const BORE_RADIUS = 1.02;      // 102mm diameter -> radius 1.02 units (1 unit = 50mm approx? scale visually)
        const CLOSED_HOLE_RADIUS = 0.022; // ~2.2mm idle hole
        const BLADE_LENGTH = 1.25;
        const BLADE_WIDTH = 0.13;
        const PIVOT_RADIUS = 1.08;      // pivot point near outer wall
        
        const bladesGroup = new THREE.Group();
        const bladesList = []; // store each blade mesh and its pivot data
        
        // Blade material: titanium look
        const bladeMaterial = new THREE.MeshStandardMaterial({ color: 0xbcaf87, metalness: 0.88, roughness: 0.25, emissive: 0x221100 });
        
        // Precompute angles
        const angleStep = (Math.PI * 2) / BLADE_COUNT;
        
        for (let i = 0; i < BLADE_COUNT; i++) {
            // create flat blade geometry (rectangular plate with slight taper, flat)
            const bladeGeo = new THREE.BoxGeometry(BLADE_WIDTH, BLADE_LENGTH, 0.018);
            const blade = new THREE.Mesh(bladeGeo, bladeMaterial.clone());
            
            // pivot point angle around center
            const pivotAngle = i * angleStep;
            const pivotX = Math.cos(pivotAngle) * PIVOT_RADIUS;
            const pivotZ = Math.sin(pivotAngle) * PIVOT_RADIUS;
            
            // initial position: placed so that blade tip extends inward towards center
            // direction from pivot to center
            const dirX = -Math.cos(pivotAngle);
            const dirZ = -Math.sin(pivotAngle);
            
            // blade default orientation: length direction points inward, width radial outward
            blade.position.set(pivotX + dirX * (BLADE_LENGTH * 0.45), 0, pivotZ + dirZ * (BLADE_LENGTH * 0.45));
            
            // rotate blade so its length aligns radially
            blade.rotation.y = pivotAngle + Math.PI / 2;
            blade.userData = {
                pivotX, pivotZ,
                pivotAngle,
                dirX, dirZ,
                maxRetract: 1.2  // full retract factor
            };
            bladesGroup.add(blade);
            bladesList.push(blade);
        }
        scene.add(bladesGroup);
        
        // Add inner aperture ring (visual detail)
        const innerRingGeo = new THREE.TorusGeometry(BORE_RADIUS - 0.05, 0.035, 64, 128);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xddccaa, metalness: 0.7, roughness: 0.3 });
        const innerRing = new THREE.Mesh(innerRingGeo, ringMat);
        innerRing.rotation.x = Math.PI / 2;
        innerRing.position.y = 0.02;
        scene.add(innerRing);
        
        // --- Vapor effect particle system at high throttle ---
        const particleCount = 400;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 2.5;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 1.2 + 0.2;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 2.5;
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.025, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        
        // --- Audio Engine: Realistic V8 Synth (tuned muscle car character) ---
        let audioContext = null;
        let isAudioEnabled = true;
        let currentGainNode = null;
        let osc1, osc2, subOsc, filter, gainMaster;
        let animationFrameId = null;
        let currentThrottle = 0;
        
        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            gainMaster = audioContext.createGain();
            gainMaster.gain.value = 0.28;
            gainMaster.connect(audioContext.destination);
            
            // main engine sound node chain
            filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.Q.value = 3.2;
            filter.frequency.value = 400;
            
            osc1 = audioContext.createOscillator();
            osc2 = audioContext.createOscillator();
            subOsc = audioContext.createOscillator();
            
            osc1.type = 'sawtooth';
            osc2.type = 'triangle';
            subOsc.type = 'sine';
            
            const gain1 = audioContext.createGain();
            const gain2 = audioContext.createGain();
            const gainSub = audioContext.createGain();
            
            osc1.connect(gain1);
            osc2.connect(gain2);
            subOsc.connect(gainSub);
            gain1.connect(filter);
            gain2.connect(filter);
            gainSub.connect(filter);
            filter.connect(gainMaster);
            
            gain1.gain.value = 0.45;
            gain2.gain.value = 0.28;
            gainSub.gain.value = 0.35;
            
            osc1.start();
            osc2.start();
            subOsc.start();
            
            currentGainNode = gainMaster;
        }
        
        function updateEngineSound(throttlePercent) {
            if (!audioContext || !isAudioEnabled || !osc1) return;
            const rpmBase = 700 + (throttlePercent / 100) * 5800;
            const engineHz = (rpmBase / 60) * 4;  // V8 firing events per sec
            const targetFreq = Math.min(220, Math.max(28, engineHz * 0.95));
            osc1.frequency.value = targetFreq;
            osc2.frequency.value = targetFreq * 1.005;
            subOsc.frequency.value = targetFreq * 0.5;
            const filterFreq = 300 + (throttlePercent / 100) * 2800;
            filter.frequency.value = Math.min(3200, filterFreq);
            const distortionGain = 0.2 + (throttlePercent / 100) * 0.45;
            if (currentGainNode) currentGainNode.gain.value = 0.2 + (throttlePercent / 100) * 0.45;
        }
        
        function resumeAudioOnInteraction() {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            } else if (!audioContext) {
                initAudio();
                audioContext?.resume();
                updateEngineSound(currentThrottle);
            }
        }
        
        document.body.addEventListener('click', resumeAudioOnInteraction, { once: true });
        document.body.addEventListener('touchstart', resumeAudioOnInteraction, { once: true });
        
        // --- Iris blade update logic: closed -> WOT, blades retract into wall ---
        function updateThrottle(throttlePercent) {
            currentThrottle = throttlePercent;
            const t = throttlePercent / 100; // 0 closed, 1 WOT
            document.getElementById('throttlePercent').innerText = Math.round(throttlePercent) + '%';
            document.getElementById('throttleSlider').value = throttlePercent;
            
            // Blade dynamics: closed state => hole radius 0.022 (2.2mm). fully open => retract factor 1.8
            // Each blade moves outward along radial direction (retract) and rotates outward
            bladesList.forEach((blade) => {
                const data = blade.userData;
                // retract amount: 0 = normal inward pointing, 1 = fully retracted into wall & slightly outwards
                let retractFactor = t * 1.25;
                if (retractFactor > 1.0) retractFactor = 1.0;
                // radial movement: from inward tip position outwards
                const outwardOffset = retractFactor * 0.82;
                // position interpolation: original inward pos -> pivot + outward direction
                const origInwardX = data.pivotX + data.dirX * (BLADE_LENGTH * 0.45);
                const origInwardZ = data.pivotZ + data.dirZ * (BLADE_LENGTH * 0.45);
                const retractedX = data.pivotX + data.dirX * outwardOffset;
                const retractedZ = data.pivotZ + data.dirZ * outwardOffset;
                blade.position.x = origInwardX * (1 - retractFactor) + retractedX * retractFactor;
                blade.position.z = origInwardZ * (1 - retractFactor) + retractedZ * retractFactor;
                // blade rotation: at closed, radial inward; at WOT, rotate further to lay flat into wall
                const addRotation = retractFactor * Math.PI * 0.56;
                blade.rotation.y = data.pivotAngle + Math.PI / 2 + addRotation;
                // also slight outward tilt
                blade.rotation.x = retractFactor * 0.4;
                // scale alpha (visual disappearance via material opacity? but keep realistic, slight fade)
                if (retractFactor > 0.85) {
                    blade.material.opacity = 1 - (retractFactor - 0.85) / 0.15;
                    blade.material.transparent = true;
                } else {
                    blade.material.opacity = 1;
                    blade.material.transparent = false;
                }
            });
            
            // Vapor effect at 90%+ throttle
            const vaporIntensity = Math.max(0, (t - 0.9) / 0.1);
            particleMaterial.opacity = vaporIntensity * 0.7;
            if (vaporIntensity > 0.01) {
                particles.rotation.y += 0.03;
                particles.rotation.x = Math.sin(Date.now() * 0.005) * 0.2;
            }
            
            // sound update
            if (audioContext && isAudioEnabled && audioContext.state === 'running') {
                updateEngineSound(throttlePercent);
            }
        }
        
        // --- UI event bindings ---
        const slider = document.getElementById('throttleSlider');
        const fullOpen = document.getElementById('fullOpenBtn');
        const fullClose = document.getElementById('fullCloseBtn');
        const cycleBtn = document.getElementById('cycleBtn');
        const wireBtn = document.getElementById('wireframeBtn');
        const muteBtn = document.getElementById('muteBtn');
        
        let wireframeMode = false;
        let cycling = false;
        let cycleInterval = null;
        
        slider.addEventListener('input', (e) => {
            if (cycling) stopCycle();
            updateThrottle(parseFloat(e.target.value));
        });
        
        fullOpen.addEventListener('click', () => {
            if (cycling) stopCycle();
            updateThrottle(100);
        });
        fullClose.addEventListener('click', () => {
            if (cycling) stopCycle();
            updateThrottle(0);
        });
        
        function stopCycle() {
            if (cycleInterval) clearInterval(cycleInterval);
            cycling = false;
            cycleBtn.textContent = '▶ CYCLE (Space)';
        }
        
        function startCycle() {
            if (cycleInterval) clearInterval(cycleInterval);
            cycling = true;
            let dir = 1;
            let val = 0;
            updateThrottle(0);
            cycleInterval = setInterval(() => {
                if (!cycling) return;
                val += dir * 1.8;
                if (val >= 100) { val = 100; dir = -1; }
                if (val <= 0) { val = 0; dir = 1; if (cycling === true) setTimeout(() => {}, 0); }
                updateThrottle(Math.min(100, Math.max(0, val)));
            }, 28);
            cycleBtn.textContent = '⏸ STOP (Space)';
        }
        
        cycleBtn.addEventListener('click', () => {
            if (cycling) stopCycle();
            else startCycle();
        });
        
        wireBtn.addEventListener('click', () => {
            wireframeMode = !wireframeMode;
            bladesList.forEach(b => b.material.wireframe = wireframeMode);
            bodyMesh.material.wireframe = wireframeMode;
            actuator.material.wireframe = wireframeMode;
            wireBtn.textContent = wireframeMode ? '🔲 SOLID (W)' : '🔲 WIREFRAME (W)';
        });
        
        let muted = false;
        muteBtn.addEventListener('click', () => {
            if (!audioContext) initAudio();
            if (muted) {
                if (gainMaster) gainMaster.gain.value = 0.28;
                muteBtn.textContent = '🔊 ON (M)';
                muted = false;
                if (audioContext && audioContext.state !== 'running') audioContext.resume();
                updateEngineSound(currentThrottle);
            } else {
                if (gainMaster) gainMaster.gain.value = 0;
                muteBtn.textContent = '🔇 OFF (M)';
                muted = true;
            }
        });
        
        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'o': updateThrottle(100); break;
                case 'c': updateThrottle(0); break;
                case ' ': e.preventDefault(); if (cycling) stopCycle(); else startCycle(); break;
                case 'w': wireBtn.click(); break;
                case 'm': muteBtn.click(); break;
                case 'r': camera.position.set(4, 3, 5); controls.target.set(0,0,0); controls.update(); break;
            }
        });
        
        // Telegram placeholder (demo chat bubble directs to OwenSonicInfinity contact)
        const telegramBtnDiv = document.getElementById('telegramBtn');
        telegramBtnDiv.addEventListener('click', () => {
            window.open('https://t.me/owensonicinfinity', '_blank');
        });
        
        // Initial blade position
        updateThrottle(0);
        
        // small engine stand / visual mount
        const standGroup = new THREE.Group();
        const poleGeo = new THREE.CylinderGeometry(0.12, 0.22, 1.6, 8);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xaa9977, metalness: 0.55 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.y = -1.0;
        standGroup.add(pole);
        const baseGeo = new THREE.BoxGeometry(1.4, 0.12, 1.4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.3 });
        const basePlate = new THREE.Mesh(baseGeo, baseMat);
        basePlate.position.y = -1.65;
        standGroup.add(basePlate);
        scene.add(standGroup);
        
        // Chevy LS style engine block subtle silhouette
        const blockGeo = new THREE.BoxGeometry(1.4, 0.65, 1.2);
        const blockMat = new THREE.MeshStandardMaterial({ color: 0x7a8e9e, metalness: 0.6, roughness: 0.5 });
        const engineBlock = new THREE.Mesh(blockGeo, blockMat);
        engineBlock.position.set(0, -0.45, 0);
        engineBlock.castShadow = true;
        scene.add(engineBlock);
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // update orbit
            // slight idle vibration of blades under 5% throttle (realism)
            if (currentThrottle < 0.08 && !cycling) {
                const jitter = Math.sin(Date.now() * 35) * 0.0006;
                bladesGroup.rotation.z = jitter;
            } else {
                bladesGroup.rotation.z = 0;
            }
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        // resize handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log('Vortex X1 9-Blade Iris Throttle Body Loaded — Realistic Iris + V8 Audio');
    </script>
</body>
</html>
